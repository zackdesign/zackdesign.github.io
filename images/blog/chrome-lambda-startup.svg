<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Three steps in order when the container starts: first Xvfb starts and owns a virtual display called :99 that draws into memory; second the DISPLAY variable is set to :99 so anything launched afterwards draws there; third the Lambda runtime starts and Puppeteer launches Chrome, which draws its pixels into Xvfb's memory without knowing there is no monitor">
  <defs>
    <style>
      .bg{fill:#0f1115}
      .h{font:700 26px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .s{font:400 19px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#9aa3b2}
      .lbl{font:600 20px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .code{font:600 20px Menlo,Consolas,monospace;fill:#ffc400}
      .p{fill:rgba(124,92,255,.14);stroke:#7c5cff;stroke-width:3}
      .t{fill:rgba(64,220,160,.14);stroke:#40dca0;stroke-width:3}
      .y{fill:rgba(255,196,0,.12);stroke:#ffc400;stroke-width:3;stroke-dasharray:10 8}
      .arrow{stroke:#9aa3b2;stroke-width:4;fill:none}
      .ah{fill:#9aa3b2}
      .sep{stroke:#2a2f3a;stroke-width:2}
    </style>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path class="ah" d="M0,0 L12,6 L0,12 z"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <line class="sep" x1="400" y1="40" x2="400" y2="480"/>
  <line class="sep" x1="800" y1="40" x2="800" y2="480"/>

  <text class="h" x="200" y="60" text-anchor="middle">1. Xvfb starts</text>
  <text class="s" x="200" y="88" text-anchor="middle">a display that exists only in memory</text>
  <rect class="y" x="50" y="130" width="300" height="200" rx="12"/>
  <text class="lbl" x="200" y="200" text-anchor="middle">Virtual display :99</text>
  <text class="s" x="200" y="232" text-anchor="middle">pixels go into memory</text>
  <text class="s" x="200" y="258" text-anchor="middle">no monitor, no graphics card</text>
  <text class="s" x="200" y="400" text-anchor="middle">Xvfb now owns display :99</text>

  <text class="h" x="600" y="60" text-anchor="middle">2. DISPLAY is set</text>
  <text class="s" x="600" y="88" text-anchor="middle">tells later programs where to draw</text>
  <rect class="p" x="450" y="190" width="300" height="80" rx="12"/>
  <text class="code" x="600" y="240" text-anchor="middle">export DISPLAY=:99</text>
  <text class="s" x="600" y="400" text-anchor="middle">anything launched from now on</text>
  <text class="s" x="600" y="426" text-anchor="middle">draws to display :99</text>

  <text class="h" x="1000" y="60" text-anchor="middle">3. Lambda runtime starts</text>
  <text class="s" x="1000" y="88" text-anchor="middle">and Puppeteer launches Chrome</text>
  <rect class="t" x="850" y="130" width="300" height="80" rx="12"/>
  <text class="lbl" x="1000" y="178" text-anchor="middle">Lambda runtime bootstrap</text>
  <path class="arrow" d="M1000 210 V245" marker-end="url(#head)"/>
  <rect class="t" x="850" y="250" width="300" height="80" rx="12"/>
  <text class="lbl" x="1000" y="298" text-anchor="middle">Chrome, with extensions</text>
  <text class="s" x="1000" y="400" text-anchor="middle">Chrome opens display :99 and draws</text>
  <text class="s" x="1000" y="426" text-anchor="middle">real pixels; it never learns it is fake</text>

  <path class="arrow" d="M355 230 H440" marker-end="url(#head)"/>
  <path class="arrow" d="M755 230 H840" marker-end="url(#head)"/>
</svg>
