<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Two timelines. Before: the Worker replies to the runner at once, then keeps triaging in the background; the platform allows about thirty seconds after the reply, so a 28-second turn finishes but a 40-second turn is cancelled with no error and no message, and the finding is never posted. After: the reply posts a plain headline immediately, and the triage turn runs as a separate queue job with its own budget of 120 seconds, so the finding follows as a second message">
  <defs>
    <style>
      .bg{fill:#0f1115}
      .h{font:700 26px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .s{font:400 18px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#9aa3b2}
      .lbl{font:600 18px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .bad{font:700 19px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#ff5d5d}
      .good{font:700 19px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#40dca0}
      .warn{font:600 17px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#ffc400}
      .axis{stroke:#2a2f3a;stroke-width:2}
      .tick{stroke:#2a2f3a;stroke-width:2}
      .reply{fill:#ffc400}
      .budget{fill:rgba(255,196,0,.10);stroke:#ffc400;stroke-width:2;stroke-dasharray:8 6}
      .turnok{fill:#7c5cff}
      .turnbad{fill:#7c5cff}
      .cut{fill:rgba(255,93,93,.35);stroke:#ff5d5d;stroke-width:3}
      .queue{fill:#40dca0}
      .sep{stroke:#2a2f3a;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="500"/>
  <line class="sep" x1="60" y1="250" x2="1140" y2="250"/>

  <!-- scale: 0 s at x=200, 8 px per second -> 120 s at x=1160 -->
  <!-- BEFORE -->
  <text class="h" x="60" y="60" text-anchor="start">Before: triage runs in the time left after the reply</text>
  <line class="axis" x1="200" y1="200" x2="1160" y2="200"/>
  <g class="s">
    <line class="tick" x1="200" y1="194" x2="200" y2="206"/><text x="200" y="228" text-anchor="middle">0 s</text>
    <line class="tick" x1="440" y1="194" x2="440" y2="206"/><text x="440" y="228" text-anchor="middle">30 s</text>
    <line class="tick" x1="680" y1="194" x2="680" y2="206"/><text x="680" y="228" text-anchor="middle">60 s</text>
    <line class="tick" x1="920" y1="194" x2="920" y2="206"/><text x="920" y="228" text-anchor="middle">90 s</text>
    <line class="tick" x1="1160" y1="194" x2="1160" y2="206"/><text x="1160" y="228" text-anchor="middle">120 s</text>
  </g>
  <rect class="budget" x="200" y="86" width="240" height="100"/>
  <text class="warn" x="320" y="80" text-anchor="middle">about 30 s allowed after the reply</text>
  <!-- reply marker -->
  <rect class="reply" x="200" y="96" width="6" height="24"/>
  <text class="lbl" x="214" y="114" text-anchor="start">reply sent: 200 to the runner</text>
  <!-- 28 s turn -->
  <rect class="turnok" x="200" y="130" width="224" height="16" rx="4"/>
  <text class="s" x="452" y="144" text-anchor="start">28 s turn: finishes, finding posted</text>
  <!-- 40 s turn cut at 30 -->
  <rect class="turnbad" x="200" y="160" width="240" height="16" rx="4"/>
  <rect class="cut" x="440" y="156" width="80" height="24" rx="4"/>
  <text class="bad" x="530" y="174" text-anchor="start">40 s turn: cancelled at 30 s, no error, no message, nothing posted</text>

  <!-- AFTER -->
  <text class="h" x="60" y="300" text-anchor="start">After: the headline goes now, the turn goes on a queue</text>
  <line class="axis" x1="200" y1="440" x2="1160" y2="440"/>
  <g class="s">
    <line class="tick" x1="200" y1="434" x2="200" y2="446"/><text x="200" y="468" text-anchor="middle">0 s</text>
    <line class="tick" x1="440" y1="434" x2="440" y2="446"/><text x="440" y="468" text-anchor="middle">30 s</text>
    <line class="tick" x1="680" y1="434" x2="680" y2="446"/><text x="680" y="468" text-anchor="middle">60 s</text>
    <line class="tick" x1="920" y1="434" x2="920" y2="446"/><text x="920" y="468" text-anchor="middle">90 s</text>
    <line class="tick" x1="1160" y1="434" x2="1160" y2="446"/><text x="1160" y="468" text-anchor="middle">120 s</text>
  </g>
  <rect class="reply" x="200" y="326" width="6" height="24"/>
  <text class="lbl" x="214" y="344" text-anchor="start">headline posted to Slack in the request itself, then reply</text>
  <rect class="budget" x="200" y="360" width="960" height="60"/>
  <text class="warn" x="1150" y="356" text-anchor="end">queue job: its own budget, turn bounded at 120 s</text>
  <rect class="queue" x="200" y="382" width="320" height="16" rx="4"/>
  <text class="good" x="530" y="396" text-anchor="start">40 s turn finishes; finding follows as a second message</text>
</svg>
