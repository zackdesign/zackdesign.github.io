<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Two portrait frames showing the floor detector's two sample bands, the wall between a quarter and half way down and the bottom 15 percent: on a headshot against a wall that merely darkens toward the floor the colour difference is 30 to 80 and no floor is declared; on a real floor the difference is 100 or more and the steepest darkening row in the bottom half becomes the floor line">
  <defs>
    <style>
      .bg{fill:#0f1115}
      .frame{fill:#181c24;stroke:#3a4150;stroke-width:2}
      .wallband{fill:rgba(124,92,255,.28);stroke:#7c5cff;stroke-width:2}
      .floorband{fill:rgba(64,220,160,.28);stroke:#40dca0;stroke-width:2}
      .floorline{stroke:#ffc400;stroke-width:4}
      .h{font:700 26px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .s{font:400 19px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#9aa3b2}
      .lbl{font:600 20px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .bad{font:700 20px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#ff5d5d}
      .good{font:700 20px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#40dca0}
      .warn{font:700 20px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#ffc400}
      .sep{stroke:#2a2f3a;stroke-width:2}
    </style>
    <linearGradient id="wallgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#20242c"/>
    </linearGradient>
    <linearGradient id="wallgrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/><stop offset="0.72" stop-color="#31353f"/><stop offset="0.73" stop-color="#151820"/><stop offset="1" stop-color="#151820"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="1200" height="520"/>
  <line class="sep" x1="600" y1="40" x2="600" y2="480"/>

  <!-- Panel 1: headshot -->
  <text class="h" x="300" y="60" text-anchor="middle">Headshot, wall darkens toward the floor</text>
  <rect x="150" y="90" width="300" height="360" fill="url(#wallgrad)" stroke="#3a4150" stroke-width="2"/>
  <rect class="wallband" x="150" y="180" width="300" height="90"/>
  <text class="lbl" x="300" y="232" text-anchor="middle">wall sample</text>
  <text class="s" x="300" y="256" text-anchor="middle">rows 25% to 50% down</text>
  <rect class="floorband" x="150" y="396" width="300" height="54"/>
  <text class="lbl" x="300" y="430" text-anchor="middle">bottom 15%</text>
  <text class="good" x="300" y="480" text-anchor="middle">difference 30 to 80: same wall, no floor</text>

  <!-- Panel 2: real floor -->
  <text class="h" x="900" y="60" text-anchor="middle">Real floor meeting the wall</text>
  <rect x="750" y="90" width="300" height="360" fill="url(#wallgrad2)" stroke="#3a4150" stroke-width="2"/>
  <rect class="wallband" x="750" y="180" width="300" height="90"/>
  <text class="lbl" x="900" y="232" text-anchor="middle">wall sample</text>
  <text class="s" x="900" y="256" text-anchor="middle">rows 25% to 50% down</text>
  <rect class="floorband" x="750" y="396" width="300" height="54"/>
  <text class="lbl" x="900" y="430" text-anchor="middle">bottom 15%</text>
  <line class="floorline" x1="750" y1="352" x2="1050" y2="352"/>
  <text class="warn" x="900" y="340" text-anchor="middle">steepest darkening = floor line</text>
  <text class="good" x="900" y="480" text-anchor="middle">difference 100 or more: floor found, left alone</text>
</svg>
