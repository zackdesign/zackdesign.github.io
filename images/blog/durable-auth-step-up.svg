<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Two sequences for the same request, deleting the account, from a session that hasn't used its passkey in the last five minutes. Top, someone holding only the cookie: the server answers 403 with reauth true, the browser has no passkey for the account, the step-up fails, and nothing is deleted. Bottom, the account's owner: the same 403, Face ID confirms with the account's own passkey, the session is marked fresh, the client retries once, and the account is deleted.">
  <defs>
    <style>
      .bg{fill:#0f1115}
      .h{font:700 24px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .t{font:600 18px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .bad{font:700 19px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#ff5d5d}
      .good{font:700 19px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#40dca0}
      .box{fill:#181b22;stroke:#7c5cff;stroke-width:3;rx:12}
      .rbox{fill:#181b22;stroke:#ff5d5d;stroke-width:3;rx:12}
      .gbox{fill:#181b22;stroke:#40dca0;stroke-width:3;rx:12}
      .arrow{stroke:#9aa3b2;stroke-width:3;fill:none}
      .sep{stroke:#2a2f3a;stroke-width:2}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520"/>

  <text class="h" x="40" y="50">Someone with only the cookie</text>
  <g transform="translate(40,80)">
    <rect class="box" width="200" height="90"/><text class="t" x="100" y="40" text-anchor="middle">Delete account,</text><text class="t" x="100" y="64" text-anchor="middle">stale session</text>
  </g>
  <line class="arrow" x1="240" y1="125" x2="292" y2="125" marker-end="url(#a)"/>
  <g transform="translate(294,80)">
    <rect class="box" width="230" height="90"/><text class="t" x="115" y="40" text-anchor="middle">403 — confirm</text><text class="t" x="115" y="64" text-anchor="middle">it's you (reauth)</text>
  </g>
  <line class="arrow" x1="524" y1="125" x2="576" y2="125" marker-end="url(#a)"/>
  <g transform="translate(578,80)">
    <rect class="rbox" width="250" height="90"/><text class="t" x="125" y="40" text-anchor="middle">No passkey for this</text><text class="t" x="125" y="64" text-anchor="middle">account on this device</text>
  </g>
  <line class="arrow" x1="828" y1="125" x2="880" y2="125" marker-end="url(#a)"/>
  <g transform="translate(882,80)">
    <rect class="gbox" width="278" height="90"/><text class="good" x="139" y="52" text-anchor="middle">Nothing is deleted</text>
  </g>

  <line class="sep" x1="40" y1="260" x2="1160" y2="260"/>

  <text class="h" x="40" y="310">The account's owner</text>
  <g transform="translate(40,340)">
    <rect class="box" width="200" height="90"/><text class="t" x="100" y="40" text-anchor="middle">Delete account,</text><text class="t" x="100" y="64" text-anchor="middle">stale session</text>
  </g>
  <line class="arrow" x1="240" y1="385" x2="292" y2="385" marker-end="url(#a)"/>
  <g transform="translate(294,340)">
    <rect class="box" width="230" height="90"/><text class="t" x="115" y="40" text-anchor="middle">403 — confirm</text><text class="t" x="115" y="64" text-anchor="middle">it's you (reauth)</text>
  </g>
  <line class="arrow" x1="524" y1="385" x2="576" y2="385" marker-end="url(#a)"/>
  <g transform="translate(578,340)">
    <rect class="gbox" width="250" height="90"/><text class="t" x="125" y="40" text-anchor="middle">Face ID, with the</text><text class="t" x="125" y="64" text-anchor="middle">account's own passkey</text>
  </g>
  <line class="arrow" x1="828" y1="385" x2="880" y2="385" marker-end="url(#a)"/>
  <g transform="translate(882,340)">
    <rect class="box" width="278" height="90"/><text class="t" x="139" y="40" text-anchor="middle">Session marked fresh;</text><text class="t" x="139" y="64" text-anchor="middle">retried once — deleted</text>
  </g>
  <text class="good" x="600" y="480" text-anchor="middle">One extra prompt for the owner. A wall for everyone else.</text>
</svg>
