<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Two panels. Left: MapKit's own tile renderer draws only tiles at the current zoom level, so during a pinch the tiles that have not loaded yet are left as holes straight through to Apple's base map, with grey hairlines at the seams. Right: the replacement renderer keeps a pyramid of loaded tiles and fills each missing tile with its nearest loaded ancestor, scaled up, until the real tile arrives">
  <defs>
    <style>
      .bg{fill:#0f1115}
      .tile{fill:#232a38;stroke:#0f1115;stroke-width:2}
      .hole{fill:#3a2b2b;stroke:#ff5d5d;stroke-width:3;stroke-dasharray:8 6}
      .standin{fill:rgba(124,92,255,.35);stroke:#7c5cff;stroke-width:3}
      .h{font:700 26px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .s{font:400 19px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#9aa3b2}
      .lbl{font:600 18px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#fff}
      .bad{font:700 20px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#ff5d5d}
      .good{font:700 20px -apple-system,Inter,Helvetica,Arial,sans-serif;fill:#40dca0}
      .sep{stroke:#2a2f3a;stroke-width:2}
      .seam{stroke:#8a8f99;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="460"/>
  <line class="sep" x1="600" y1="40" x2="600" y2="430"/>

  <!-- Panel 1: MapKit -->
  <text class="h" x="300" y="60" text-anchor="middle">MapKit's renderer, mid-pinch</text>
  <text class="s" x="300" y="88" text-anchor="middle">draws only the current zoom level</text>
  <g transform="translate(140,120)">
    <rect class="tile" x="0" y="0" width="80" height="80"/><rect class="tile" x="80" y="0" width="80" height="80"/><rect class="hole" x="160" y="0" width="80" height="80"/><rect class="tile" x="240" y="0" width="80" height="80"/>
    <rect class="tile" x="0" y="80" width="80" height="80"/><rect class="hole" x="80" y="80" width="80" height="80"/><rect class="hole" x="160" y="80" width="80" height="80"/><rect class="tile" x="240" y="80" width="80" height="80"/>
    <rect class="tile" x="0" y="160" width="80" height="80"/><rect class="tile" x="80" y="160" width="80" height="80"/><rect class="tile" x="160" y="160" width="80" height="80"/><rect class="hole" x="240" y="160" width="80" height="80"/>
    <line class="seam" x1="80" y1="0" x2="80" y2="240"/>
    <line class="seam" x1="0" y1="160" x2="320" y2="160"/>
  </g>
  <text class="lbl" x="300" y="388" text-anchor="middle">loaded tiles, holes where tiles have not arrived,</text>
  <text class="bad" x="300" y="416" text-anchor="middle">Apple's base map shows through, grey lines at seams</text>

  <!-- Panel 2: pyramid -->
  <text class="h" x="900" y="60" text-anchor="middle">Pyramid renderer, same moment</text>
  <text class="s" x="900" y="88" text-anchor="middle">a missing tile is stood in for by its nearest loaded ancestor, scaled</text>
  <g transform="translate(740,120)">
    <rect class="tile" x="0" y="0" width="80" height="80"/><rect class="tile" x="80" y="0" width="80" height="80"/><rect class="standin" x="160" y="0" width="80" height="80"/><rect class="tile" x="240" y="0" width="80" height="80"/>
    <rect class="tile" x="0" y="80" width="80" height="80"/><rect class="standin" x="80" y="80" width="80" height="80"/><rect class="standin" x="160" y="80" width="80" height="80"/><rect class="tile" x="240" y="80" width="80" height="80"/>
    <rect class="tile" x="0" y="160" width="80" height="80"/><rect class="tile" x="80" y="160" width="80" height="80"/><rect class="tile" x="160" y="160" width="80" height="80"/><rect class="standin" x="240" y="160" width="80" height="80"/>
  </g>
  <text class="lbl" x="900" y="388" text-anchor="middle">purple: a parent tile, enlarged, until the real one lands</text>
  <text class="good" x="900" y="416" text-anchor="middle">no hole, ever; blurry for a moment instead</text>
</svg>
